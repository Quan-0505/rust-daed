name: Build and verify Rust daed release assets

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-daed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native and cross-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang llvm libclang-dev libelf-dev cmake libssl-dev perl pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-dev curl file zstd

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          components: rust-src

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Keep stable as the top-level compiler
        run: rustup default stable

      - name: Install pinned BPF linker release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bpf-linker-v0.12.0.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/bpf-linker"
          linker="$(find "$RUNNER_TEMP/bpf-linker" -type f -name bpf-linker -print -quit)"
          test -n "$linker"
          install -m 0755 "$linker" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version

      - name: Build pinned sources and package all targets
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          bash -n scripts/build-release.sh scripts/package-release.sh
          RUST_RELEASE_CACHE="$RUNNER_TEMP/rust-cache" bash scripts/build-release.sh "$RUNNER_TEMP/rust-daed-release"

      - name: Test BPF parser and verify package contents
        run: |
          cargo test --manifest-path "$RUNNER_TEMP/rust-daed-release/ui/DaeNext/Cargo.toml" --locked -p dae-ebpf-program --lib
          python3 - <<'PY'
          import hashlib, pathlib
          assets=pathlib.Path("${{ runner.temp }}/rust-daed-release/assets")
          files=sorted(p for p in assets.iterdir() if p.is_file())
          assert len(files)==6, [p.name for p in files]
          (assets/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          for p in files:
              assert p.stat().st_size > 100_000, (p.name, p.stat().st_size)
          print('\n'.join(f'{p.name}: {p.stat().st_size} bytes' for p in files))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rust-daed-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/rust-daed-release/assets/
          if-no-files-found: error
          retention-days: 14
